<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 700" width="512" height="700">
  <defs>
    <clipPath id="frame">
      <rect x="20" y="20" width="472" height="480" rx="8"/>
    </clipPath>
  </defs>
  
  <!-- Fond rouge -->
  <rect width="512" height="700" fill="#DC2626"/>
  
  <!-- Bordure blanche extérieure -->
  <rect x="16" y="16" width="480" height="488" rx="10" fill="none" stroke="#FFFFFF" stroke-width="10"/>
  
  <!-- Symbole blanc sur fond rouge (basé sur le logo original potrace) -->
  <g clip-path="url(#frame)" fill="#FFFFFF">
    <!-- Grand A / triangle central -->
    <path d="M256 40 L400 420 L360 420 L320 340 L280 420 L256 420 L200 280 L236 280 L250 310 L256 280 L272 310 L288 280 L300 280 Z M256 120 L216 220 L296 220 Z"/>
    
    <!-- Ligne horizontale traversant le A -->
    <rect x="120" y="240" width="272" height="14" rx="3"/>
    
    <!-- Lettre I à gauche -->
    <rect x="100" y="80" width="22" height="320" rx="4"/>
    
    <!-- Lettre P stylisée à droite -->
    <path d="M380 280 L380 400 L340 400 L340 280 Z"/>
    <circle cx="360" cy="250" r="30"/>
    
    <!-- Lettre E stylisée en bas -->
    <path d="M400 320 L400 400 L440 400 L440 380 L416 380 L416 350 L436 350 L436 330 L416 330 L416 310 L440 310 L440 296 L400 296 Z"/>
  </g>
  
  <!-- Bande blanche pour le texte -->
  <rect y="510" width="512" height="90" fill="#FFFFFF"/>
  
  <!-- Texte IPCE PARTNERS en noir -->
  <text x="256" y="568" text-anchor="middle" font-family="'Arial Black', 'Impact', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="3" fill="#1a1a1a">IPCE PARTNERS</text>
  
  <!-- Texte Good to Great en blanc sur fond rouge -->
  <rect y="600" width="512" height="100" fill="#DC2626"/>
  <text x="256" y="665" text-anchor="middle" font-family="'Georgia', 'Palatino', 'Times New Roman', serif" font-size="44" font-weight="700" font-style="italic" fill="#FFFFFF">Good to Great</text>
</svg>